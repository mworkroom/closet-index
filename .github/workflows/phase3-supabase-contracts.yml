name: Phase 3 Supabase Contract Tests

on:
  push:
    branches:
      - "codex/phase3-*"
    paths:
      - .github/workflows/phase3-supabase-contracts.yml
      - supabase/migrations/**
      - supabase/rollback/**
      - supabase/test-support/**
      - supabase/tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-supabase-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-database-contracts:
    name: Phase 3 pgTAP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Add shared workspace contract fixture
        run: >-
          cp supabase/test-support/shared_workspace_fixture.sql
          supabase/migrations/20260725000000_ci_shared_workspace_contract.sql

      - name: Start isolated Supabase
        run: >-
          supabase start --yes
          --exclude studio,imgproxy,mailpit,logflare,edge-runtime,realtime,vector

      - name: Run Phase 3 database contract tests
        run: >-
          supabase test db --local
          supabase/tests/phase1_schema_contract_test.sql
          supabase/tests/import_runs_cleanup_contract_test.sql
          supabase/tests/phase3_item_outfit_write_contract_test.sql
          supabase/tests/outfit_clone_cleanup_contract_test.sql
          supabase/tests/phase3_item_image_upload_contract_test.sql
          supabase/tests/outfit_preview_cleanup_contract_test.sql
          supabase/tests/replacement_line_color_category_contract_test.sql
          supabase/tests/replacement_line_management_contract_test.sql

      - name: Apply Import Runs schema rollback
        run: >-
          docker exec --interactive supabase_db_closet-index
          psql --no-psqlrc --set ON_ERROR_STOP=on
          --username postgres --dbname postgres
          < supabase/rollback/remove_closet_import_runs_rollback.sql

      - name: Verify Import Runs schema rollback
        run: >-
          supabase test db --local
          supabase/tests/import_runs_rollback_contract_test.sql

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-link-cleanup-contracts:
    name: Legacy Link cleanup and rollback pgTAP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Withhold cleanup migration for the pre-cleanup fixture
        run: >-
          mv
          supabase/migrations/20260826160924_remove_replacement_legacy_link_subsystem.sql
          /tmp/20260826160924_remove_replacement_legacy_link_subsystem.sql

      - name: Add shared workspace contract fixture
        run: >-
          cp supabase/test-support/shared_workspace_fixture.sql
          supabase/migrations/20260725000000_ci_shared_workspace_contract.sql

      - name: Start isolated pre-cleanup Supabase
        run: >-
          supabase start --yes
          --exclude studio,imgproxy,mailpit,logflare,edge-runtime,realtime,vector

      - name: Insert synthetic Legacy and manual edges
        run: >-
          docker exec --interactive supabase_db_closet-index
          psql --no-psqlrc --set ON_ERROR_STOP=on
          --username postgres --dbname postgres
          < supabase/test-support/replacement_legacy_link_cleanup_fixture.sql

      - name: Apply the cleanup migration atomically
        run: >-
          docker exec --interactive supabase_db_closet-index
          psql --no-psqlrc --set ON_ERROR_STOP=on
          --username postgres --dbname postgres
          < /tmp/20260826160924_remove_replacement_legacy_link_subsystem.sql

      - name: Verify cleanup and retained Lineage contracts
        run: >-
          supabase test db --local
          supabase/tests/replacement_legacy_link_cleanup_contract_test.sql
          supabase/tests/replacement_line_color_category_contract_test.sql
          supabase/tests/replacement_line_creation_contract_test.sql
          supabase/tests/replacement_line_decision_reason_contract_test.sql
          supabase/tests/replacement_line_item_membership_contract_test.sql
          supabase/tests/replacement_line_management_contract_test.sql

      - name: Apply emergency schema rollback
        run: >-
          docker exec --interactive supabase_db_closet-index
          psql --no-psqlrc --set ON_ERROR_STOP=on
          --username postgres --dbname postgres
          < supabase/rollback/remove_replacement_legacy_link_subsystem_rollback.sql

      - name: Verify rollback and synthetic data restoration
        run: >-
          supabase test db --local
          supabase/tests/replacement_legacy_link_rollback_contract_test.sql

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
