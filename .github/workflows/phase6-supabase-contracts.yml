name: Phase 6 Supabase Contract Tests

on:
  push:
    branches:
      - "codex/phase6-*"
    paths:
      - .github/workflows/phase6-supabase-contracts.yml
      - supabase/migrations/20260805170605_p6_2_purchase_events.sql
      - supabase/migrations/20260805191039_p6_4_care_events.sql
      - supabase/migrations/20260805202648_p6_event_foreign_key_indexes.sql
      - supabase/migrations/20260805230843_preserve_quantity_for_general_purchase_events.sql
      - supabase/test-support/**
      - supabase/tests/p6_2_purchase_events_contract_test.sql
      - supabase/tests/p6_4_care_events_contract_test.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-supabase-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase6-database-contracts:
    name: Phase 6 purchase and care pgTAP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Add shared workspace contract fixture
        run: >-
          cp supabase/test-support/shared_workspace_fixture.sql
          supabase/migrations/20260725000000_ci_shared_workspace_contract.sql

      - name: Start isolated Supabase
        run: >-
          supabase start --yes
          --exclude studio,imgproxy,mailpit,logflare,edge-runtime,realtime,vector

      - name: Run Phase 6 database contract tests
        run: >-
          supabase test db --local
          supabase/tests/p6_2_purchase_events_contract_test.sql
          supabase/tests/p6_4_care_events_contract_test.sql

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
