<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closet Index 대량 이미지 연결</title>
    <style>
      :root {
        font-family: Pretendard, "Segoe UI", sans-serif;
        color: #27231f;
        background: #f4f0e9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font: inherit; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: #34302c;
        color: white;
        cursor: pointer;
      }
      button.secondary { background: #dfd7ca; color: #27231f; }
      button.danger { background: #a93f35; }
      button:disabled { cursor: wait; opacity: .55; }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 18px clamp(16px, 4vw, 48px);
        background: rgba(244, 240, 233, .94);
        border-bottom: 1px solid #d8d0c4;
        backdrop-filter: blur(12px);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      header p { margin: 0; color: #6d645b; font-size: 14px; }
      main { padding: 24px clamp(16px, 4vw, 48px) 80px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 18px;
      }
      .summary { margin-right: auto; font-weight: 700; }
      .replace {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 10px;
        background: #fff7e3;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .card {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 13px;
        min-width: 0;
        padding: 12px;
        border: 1px solid #d8d0c4;
        border-radius: 16px;
        background: #fffdf9;
      }
      .card.unmatched { border-color: #c46456; }
      .preview {
        width: 92px;
        height: 116px;
        object-fit: contain;
        border-radius: 11px;
        background:
          linear-gradient(45deg, #eee 25%, transparent 25%),
          linear-gradient(-45deg, #eee 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #eee 75%),
          linear-gradient(-45deg, transparent 75%, #eee 75%);
        background-size: 14px 14px;
        background-position: 0 0, 0 7px, 7px -7px, -7px 0;
      }
      .filename {
        overflow: hidden;
        margin: 1px 0 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 700;
      }
      .match {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #c9c0b4;
        border-radius: 9px;
        background: white;
      }
      .hint { margin: 7px 0 0; color: #71675e; font-size: 12px; }
      .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .badge {
        padding: 3px 7px;
        border-radius: 999px;
        background: #e7efe5;
        color: #365238;
        font-size: 11px;
      }
      .badge.ready { background: #fff0cc; color: #76500c; }
      .progress {
        display: none;
        margin: 0 0 18px;
        padding: 13px;
        border-radius: 12px;
        background: #e8e1d7;
        white-space: pre-wrap;
      }
      .progress.visible { display: block; }
      dialog {
        width: min(560px, calc(100vw - 32px));
        border: 0;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 22px 80px #0004;
      }
      dialog::backdrop { background: #211d1999; }
      dialog pre {
        max-height: 45vh;
        overflow: auto;
        padding: 12px;
        border-radius: 10px;
        background: #f3efe9;
        white-space: pre-wrap;
      }
      @media (max-width: 540px) {
        .card { grid-template-columns: 72px 1fr; }
        .preview { width: 72px; height: 96px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>대량 이미지 연결</h1>
      <p id="inbox">누끼 폴더를 확인하고 있습니다.</p>
    </header>
    <main>
      <div class="toolbar">
        <span class="summary" id="summary">불러오는 중…</span>
        <button class="secondary" id="openInbox">누끼 폴더 열기</button>
        <button class="secondary" id="reload">폴더 다시 읽기</button>
        <button class="secondary" id="save">매칭 저장</button>
        <button id="dryRun">Dry-run</button>
        <label class="replace">
          <input type="checkbox" id="allowReplace" />
          기존 이미지 교체 허용
        </label>
        <button class="danger" id="apply">Supabase 업로드</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="cards" id="cards"></div>
      <datalist id="itemOptions"></datalist>
    </main>
    <dialog id="dialog">
      <h2 id="dialogTitle">결과</h2>
      <pre id="dialogBody"></pre>
      <button id="dialogClose">닫기</button>
    </dialog>
    <script>
      let state = null;
      let mappings = {};
      const labels = new Map();
      const byId = new Map();
      const cards = document.querySelector("#cards");
      const progress = document.querySelector("#progress");
      const dialog = document.querySelector("#dialog");

      function itemLabel(item) {
        return `${item.name} — ${item.category} — ${item.id}`;
      }

      async function request(url, options) {
        const response = await fetch(url, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "요청에 실패했습니다.");
        return body;
      }

      function showResult(title, value) {
        document.querySelector("#dialogTitle").textContent = title;
        document.querySelector("#dialogBody").textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
        dialog.showModal();
      }

      function updateSummary() {
        const selected = Object.values(mappings).filter(Boolean).length;
        const unmatched = state.files.length - selected;
        document.querySelector("#summary").textContent =
          `${state.files.length}개 파일 · ${selected}개 연결 · ${unmatched}개 미연결`;
      }

      function render() {
        labels.clear();
        byId.clear();
        const options = document.querySelector("#itemOptions");
        options.replaceChildren();
        for (const item of state.items) {
          const label = itemLabel(item);
          labels.set(label, item.id);
          byId.set(item.id, item);
          const option = document.createElement("option");
          option.value = label;
          options.append(option);
        }

        cards.replaceChildren();
        for (const file of state.files) {
          const itemId = mappings[file.name] || "";
          const item = byId.get(itemId);
          const card = document.createElement("article");
          card.className = `card${item ? "" : " unmatched"}`;
          const suggestion = file.suggestions
            .map(({ itemId: id }) => byId.get(id)?.name)
            .filter(Boolean)
            .slice(0, 3)
            .join(", ");
          card.innerHTML = `
            <img class="preview" src="/preview?file=${encodeURIComponent(file.name)}" alt="" />
            <div>
              <p class="filename" title="${file.name.replaceAll('"', "&quot;")}">${file.name}</p>
              <input class="match" list="itemOptions" placeholder="Item 이름 검색" />
              <p class="hint">${suggestion ? `후보: ${suggestion}` : "자동 후보 없음"}</p>
              <div class="badges"></div>
            </div>
          `;
          const input = card.querySelector(".match");
          input.value = item ? itemLabel(item) : "";
          input.addEventListener("change", () => {
            const selectedId = labels.get(input.value) || "";
            if (selectedId) mappings[file.name] = selectedId;
            else delete mappings[file.name];
            render();
          });
          const badges = card.querySelector(".badges");
          if (file.autoItemId === itemId) {
            badges.insertAdjacentHTML("beforeend", '<span class="badge">자동 매칭</span>');
          }
          if (item?.hasReadyImage) {
            badges.insertAdjacentHTML("beforeend", '<span class="badge ready">기존 이미지 있음</span>');
          }
          cards.append(card);
        }
        updateSummary();
      }

      async function load() {
        progress.classList.remove("visible");
        state = await request("/api/state");
        mappings = { ...state.mappings };
        document.querySelector("#inbox").textContent =
          `이 폴더에 누끼를 넣으세요: ${state.inboxPath}`;
        render();
      }

      async function save() {
        const result = await request("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mappings }),
        });
        mappings = result.mappings;
        updateSummary();
        return result;
      }

      async function processAll(mode) {
        await save();
        const entries = Object.entries(mappings).filter(([, itemId]) => itemId);
        if (entries.length === 0) throw new Error("연결된 파일이 없습니다.");
        const allowReplace = document.querySelector("#allowReplace").checked;
        if (mode === "apply") {
          const readyCount = entries.filter(([, itemId]) =>
            byId.get(itemId)?.hasReadyImage,
          ).length;
          const message =
            `${entries.length}개 이미지를 Supabase에 업로드합니다.` +
            (readyCount ? ` 기존 이미지 ${readyCount}개가 포함됩니다.` : "") +
            "\n계속할까요?";
          if (!window.confirm(message)) return;
        }

        const buttons = [...document.querySelectorAll("button")];
        buttons.forEach((button) => { button.disabled = true; });
        progress.classList.add("visible");
        const results = [];
        try {
          for (let index = 0; index < entries.length; index += 1) {
            const [filename, itemId] = entries[index];
            progress.textContent =
              `${mode === "apply" ? "업로드" : "검사"} 중 ${index + 1}/${entries.length}\n${filename}`;
            const result = await request("/api/process", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                filename,
                itemId,
                mode,
                allowReplace,
                confirm: mode === "apply" ? "UPLOAD" : undefined,
              }),
            });
            results.push(result);
          }
          progress.textContent = `${entries.length}/${entries.length} 완료`;
          showResult(
            mode === "apply" ? "업로드 완료" : "Dry-run 완료",
            {
              processed: results.length,
              warnings: results.flatMap((result) =>
                result.warnings.map((warning) => ({
                  filename: result.filename,
                  warning,
                })),
              ),
            },
          );
          if (mode === "apply") await load();
        } finally {
          buttons.forEach((button) => { button.disabled = false; });
        }
      }

      document.querySelector("#reload").addEventListener("click", () =>
        load().catch((error) => showResult("불러오기 실패", error.message)),
      );
      document.querySelector("#openInbox").addEventListener("click", () =>
        request("/api/open-inbox", { method: "POST" })
          .catch((error) => showResult("폴더 열기 실패", error.message)),
      );
      document.querySelector("#save").addEventListener("click", () =>
        save()
          .then(() => showResult("저장 완료", "매칭을 로컬에 저장했습니다."))
          .catch((error) => showResult("저장 실패", error.message)),
      );
      document.querySelector("#dryRun").addEventListener("click", () =>
        processAll("dry-run").catch((error) => showResult("Dry-run 실패", error.message)),
      );
      document.querySelector("#apply").addEventListener("click", () =>
        processAll("apply").catch((error) => showResult("업로드 중단", error.message)),
      );
      document.querySelector("#dialogClose").addEventListener("click", () => dialog.close());
      load().catch((error) => showResult("초기화 실패", error.message));
    </script>
  </body>
</html>
